<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | CLEANNOVA</title>
  <meta name="description" content="Đăng nhập CLEANNOVA bằng tài khoản demo.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <meta name="theme-color" content="#FAF8F4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/mobile-fixes.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/luxe.css">
  <link rel="stylesheet" href="css/luxe-pro.css">
  <link rel="stylesheet" href="css/decor.css">
</head>
<body class="login-page">
  <header id="main-header"></header>

  <main class="login-stage">
    <!-- decor -->
    <svg class="login-arc" viewBox="0 0 800 800" aria-hidden="true">
      <circle cx="400" cy="400" r="260" /><circle cx="400" cy="400" r="340" /><circle cx="400" cy="400" r="420" />
    </svg>
    <span class="login-sweep" aria-hidden="true"></span>

    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <a href="index.html" class="login-logo" aria-label="CLEANNOVA"><img src="assets/logo/cleannova-mark.svg" alt="" width="120" height="120"><span class="lt-brand"><b>CLEAN</b><i>NOVA</i></span><span class="lt-sub">Robotic Vacuum Cleaner</span></a>
      </div>
      <h1 id="login-title">Chào mừng trở lại</h1>
      <p class="login-sub">Đăng nhập để tiếp tục với CLEANNOVA</p>

      <div class="login-alert" id="login-alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <label class="lf-field">
          <span>Tên đăng nhập</span>
          <input id="lf-user" type="text" autocomplete="username" placeholder="admin hoặc user" autofocus>
        </label>
        <label class="lf-field">
          <span>Mật khẩu</span>
          <div class="lf-pass">
            <input id="lf-pass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
            <button type="button" id="lf-eye" aria-label="Hiện mật khẩu">👁</button>
          </div>
        </label>
        <button type="submit" class="btn btn-primary btn-lg btn-block btn-shimmer" id="lf-submit">Đăng nhập</button>
      </form>

      <div class="demo-box">
        <div class="demo-title">Tài khoản demo <small>· bấm để điền nhanh</small></div>
        <div class="demo-list">
          <button type="button" class="demo-chip" data-u="admin" data-p="123456">
            <span class="demo-ic">👑</span>
            <span><strong>Admin</strong><small>admin / 123456 · vào trang quản trị</small></span>
          </button>
          <button type="button" class="demo-chip" data-u="user" data-p="123456">
            <span class="demo-ic">🙂</span>
            <span><strong>Khách hàng</strong><small>user / 123456 · mua sắm</small></span>
          </button>
        </div>
      </div>
      <a href="index.html" class="login-back">← Về trang chủ</a>
    </section>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      const safeNext = f => (f && /^[\w-]+\.html$/.test(f)) ? f : null;
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const card = document.querySelector('.login-card');
      const uEl = document.getElementById('lf-user'), pEl = document.getElementById('lf-pass');

      const existing = getSession();
      if (existing && !params.get('denied')) { location.replace(safeNext(next) || existing.home); return; }
      if (params.get('denied')) showError('Tài khoản hiện tại không có quyền vào khu vực quản trị. Hãy đăng nhập bằng tài khoản Admin.');

      function showError(msg) {
        alertBox.textContent = msg; alertBox.hidden = false;
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      }
      document.querySelectorAll('.demo-chip').forEach(b => b.addEventListener('click', () => {
        uEl.value = b.dataset.u; pEl.value = b.dataset.p; alertBox.hidden = true;
        document.querySelectorAll('.demo-chip').forEach(x => x.classList.toggle('picked', x === b));
      }));
      document.getElementById('lf-eye').addEventListener('click', () => {
        pEl.type = pEl.type === 'password' ? 'text' : 'password';
      });
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (!uEl.value.trim() || !pEl.value) return showError('Vui lòng nhập tên đăng nhập và mật khẩu.');
        const s = login(uEl.value, pEl.value);
        if (!s) return showError('Tên đăng nhập hoặc mật khẩu chưa đúng. Hãy thử tài khoản demo bên dưới nhé.');
        alertBox.hidden = true;
        const btn = document.getElementById('lf-submit');
        btn.classList.add('loading'); btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
        showToast('Xin chào, ' + s.name + '!', '✦');
        // admin luôn vào khu quản trị; user vào trang đã yêu cầu hoặc trang chủ
        const dest = s.role === 'admin' ? (safeNext(next) && next.startsWith('admin') ? next : s.home) : (safeNext(next) && !next.startsWith('admin') ? next : s.home);
        setTimeout(() => { location.href = dest; }, 750);
      });
    })();
  </script>
  <script src="js/luxe.js" defer></script>
  <script src="js/luxe-pro.js" defer></script>
  <script src="js/decor.js" defer></script>
</body>
</html>
