<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Tồn Kho | CLEANNOVA ADMIN</title>
  <meta name="description" content="Quản lý tồn kho robot hút bụi và phụ kiện tiêu hao thay thế Cleannova.">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/mobile-fixes.css">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-page-title">
          <h1>Quản Lý Tồn Kho & Xuất Nhập</h1>
          <p>Chương 4.3 – Theo dõi lượng hàng trong kho, số lượng đã bán và cảnh báo tồn kho tối thiểu</p>
        </div>
        <div>
          <button onclick="showToast('Tạo phiếu nhập kho mới...', '📦')" class="btn btn-cta btn-sm">
            + Tạo Phiếu Nhập Kho
          </button>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h2 class="admin-card-title">Tình Trạng Kho Hàng Robot & Phụ Kiện Tiêu Hao</h2>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Tên Mặt Hàng</th>
                <th>Tồn Kho Thực Tế</th>
                <th>Đã Tiêu Thụ</th>
                <th>Giá Bán</th>
                <th>Cảnh Báo Tồn Kho</th>
                <th>Thao Tác</th>
              </tr>
            </thead>
            <tbody id="admin-inventory-table-body">
              <!-- Populated by admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
