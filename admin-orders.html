<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Đơn Hàng | CLEANNOVA ADMIN</title>
  <meta name="description" content="Quản lý và cập nhật tiến độ xử lý đơn hàng hệ thống Cleannova.">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-page-title">
          <h1>Quản Lý Đơn Hàng</h1>
          <p>Chương 4.3 – Danh sách đơn đặt mua, phương thức thanh toán và tiến độ giao hàng</p>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h2 class="admin-card-title">Tất Cả Đơn Đặt Hàng</h2>
          <div style="display: flex; gap: 8px;">
            <button onclick="showToast('Đang lọc đơn hàng: Tất cả', '📋')" class="btn btn-secondary btn-sm">Tất cả</button>
            <button onclick="showToast('Đang lọc: Đang xử lý', '⏳')" class="btn btn-secondary btn-sm">Đang xử lý</button>
            <button onclick="showToast('Đang lọc: Đang giao', '🚚')" class="btn btn-secondary btn-sm">Đang giao</button>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Mã Đơn</th>
                <th>Khách Hàng</th>
                <th>Sản Phẩm</th>
                <th>Ngày Đặt</th>
                <th>Tổng Tiền</th>
                <th>Trạng Thái</th>
                <th>Cập Nhật</th>
              </tr>
            </thead>
            <tbody id="all-orders-table-body">
              <!-- Populated by admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
