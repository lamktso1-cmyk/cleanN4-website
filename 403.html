<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Quyền Truy Cập Bị Từ Chối | CLEANNOVA</title>
  <meta name="description" content="Khu vực quản trị chỉ dành riêng cho Quản trị viên hệ thống CleanNova.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile-fixes.css">

  <style>
    .forbidden-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .forbidden-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }
    .forbidden-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    }
    .forbidden-icon-badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(198, 166, 103, 0.12);
      border: 1px solid rgba(198, 166, 103, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: var(--gold-dark);
    }
    .forbidden-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .forbidden-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .forbidden-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Injection -->
  <header id="main-header"></header>

  <main class="forbidden-wrapper">
    <div class="forbidden-card">
      <div class="forbidden-icon-badge">🔒</div>
      <div style="display: inline-block; font-size: 0.8125rem; font-weight: 700; color: var(--gold-dark); background: rgba(198, 166, 103, 0.15); padding: 4px 14px; border-radius: 999px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;">
        Mã Lỗi: 403 Forbidden
      </div>
      <h1 class="forbidden-title">Quyền Truy Cập Bị Từ Chối</h1>
      <p class="forbidden-desc">
        Tài khoản hiện tại của bạn không có quyền Quản trị viên để truy cập Bảng điều khiển quản lý CleanNova.
        Khu vực này được bảo vệ nghiêm ngặt phía máy chủ bằng cơ chế phân quyền RBAC.
      </p>

      <div class="forbidden-actions">
        <a href="index.html" class="btn btn-primary btn-lg">
          <span>🌐 Quay Về Trang Mua Sắm</span>
        </a>
        <a href="login.html?redirect=admin.html" class="btn btn-secondary btn-lg" onclick="Auth.logout()">
          <span>🔑 Đăng Nhập Tài Khoản Quản Trị Khác</span>
        </a>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
