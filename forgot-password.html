<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi Phục Mật Khẩu | CLEANNOVA</title>
  <meta name="description" content="Khôi phục mật khẩu tài khoản CleanNova nhanh chóng và bảo mật.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile-fixes.css">

  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 20%, rgba(198, 166, 103, 0.04) 0%, rgba(248, 250, 252, 1) 100%);
    }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.07);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      font-family: inherit;
      color: var(--text-primary);
      background: #FFFFFF;
      outline: none;
      transition: all var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(198, 166, 103, 0.15);
    }
    .auth-alert {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }
    .auth-alert-danger {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #DC2626;
    }
    .auth-alert-success {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #059669;
    }
    .auth-link {
      color: var(--gold-dark);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Dynamic Header Injection -->
  <header id="main-header"></header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title" id="page-heading">Quên mật khẩu?</h1>
        <p class="auth-subtitle" id="page-desc">
          Nhập địa chỉ email đăng ký để nhận mã khôi phục và đặt lại mật khẩu an toàn.
        </p>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <!-- Form 1: Yêu cầu mã khôi phục -->
      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Địa chỉ Email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="tenban@vidu.com" required>
        </div>

        <button type="submit" id="submit-forgot-btn" class="btn btn-primary btn-lg btn-block">
          <span>Gửi Liên Kết Khôi Phục</span>
        </button>
      </form>

      <!-- Form 2: Nhập mật khẩu mới (khi có token) -->
      <form id="reset-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reset-pwd">Mật khẩu mới</label>
          <input type="password" id="reset-pwd" class="form-input" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm-pwd">Xác nhận mật khẩu mới</label>
          <input type="password" id="reset-confirm-pwd" class="form-input" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
        </div>

        <button type="submit" id="submit-reset-btn" class="btn btn-primary btn-lg btn-block">
          <span>Lưu Mật Khẩu Mới</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
        <a href="login.html" class="auth-link">← Quay lại Đăng nhập</a>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');

    const alertBox = document.getElementById('auth-alert');
    function showAlert(msg, type = 'danger') {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert auth-alert-${type}`;
      alertBox.style.display = 'block';
    }

    // Nếu trên URL có token, chuyển sang màn hình Đặt lại mật khẩu
    if (resetToken) {
      document.getElementById('page-heading').textContent = 'Đặt lại mật khẩu';
      document.getElementById('page-desc').textContent = 'Vui lòng thiết lập mật khẩu mới cho tài khoản của bạn.';
      document.getElementById('forgot-form').style.display = 'none';
      document.getElementById('reset-form').style.display = 'block';
    }

    // Xử lý gửi yêu cầu quên mật khẩu
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      const submitBtn = document.getElementById('submit-forgot-btn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Đang gửi...</span>';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          let msg = data.message;
          if (data.resetUrl) {
            msg += ` <br><br><a href="${data.resetUrl}" class="auth-link" style="text-decoration:underline;">[Nhấn vào đây để đặt lại mật khẩu demo ngay]</a>`;
          }
          alertBox.innerHTML = msg;
          alertBox.className = 'auth-alert auth-alert-success';
          alertBox.style.display = 'block';
          submitBtn.style.display = 'none';
        } else {
          showAlert(data.message || 'Không thể xử lý yêu cầu.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Gửi Liên Kết Khôi Phục</span>';
        }
      } catch (err) {
        showAlert('Lỗi kết nối máy chủ.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Gửi Liên Kết Khôi Phục</span>';
      }
    });

    // Xử lý lưu mật khẩu mới
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPwd = document.getElementById('reset-pwd').value;
      const confirmPwd = document.getElementById('reset-confirm-pwd').value;
      const submitBtn = document.getElementById('submit-reset-btn');

      if (newPwd.length < 6) {
        showAlert('Mật khẩu mới phải có tối thiểu 6 ký tự.');
        return;
      }

      if (newPwd !== confirmPwd) {
        showAlert('Mật khẩu xác nhận không khớp.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Đang lưu...</span>';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, new_password: newPwd })
        });
        const data = await res.json();

        if (data.success) {
          showAlert(data.message + ' Đang chuyển về trang đăng nhập...', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          showAlert(data.message || 'Lỗi đặt lại mật khẩu.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Lưu Mật Khẩu Mới</span>';
        }
      } catch (err) {
        showAlert('Lỗi kết nối máy chủ.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Lưu Mật Khẩu Mới</span>';
      }
    });
  </script>
</body>
</html>
